name: Android build

on:
  pull_request:
  push:
    branches: [main, feature/magnetometer-logger-app, "codex/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Pressure-MAG-Recorder-v70-debug.apk

      - name: Upload Pressure MAG Recorder v70 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRESSURE-MAG-RECORDER-v70-debug-apk
          path: app/build/outputs/apk/debug/Pressure-MAG-Recorder-v70-debug.apk
